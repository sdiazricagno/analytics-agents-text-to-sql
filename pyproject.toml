[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-agents-text-to-sql"
version = "0.1.0"
description = "Multi-agent conversational analytics with a semantic layer router and guarded Text-to-SQL"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "sqlglot>=25",
    "langgraph>=0.2",
    "openai>=1.40",
    "pyyaml>=6",
    "pandas>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
t2s-chat = "t2s.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
