# Golden benchmark: natural-language questions with hand-written gold SQL.
# Difficulty is derived from the gold SQL (tables joined, nesting) by the harness.
- id: q01
  question: How many customers are there?
  sql: SELECT COUNT(*) FROM customers
- id: q02
  question: How many orders were placed in 2024?
  sql: SELECT COUNT(*) FROM orders WHERE EXTRACT(year FROM order_date) = 2024
- id: q03
  question: How many orders per channel?
  sql: SELECT channel, COUNT(*) FROM orders GROUP BY channel
- id: q04
  question: What is the average list price of all products?
  sql: SELECT AVG(list_price) FROM products
- id: q05
  question: How many customers are loyalty members?
  sql: SELECT COUNT(*) FROM customers WHERE loyalty_member
- id: q06
  question: Number of returns by return reason
  sql: SELECT reason, COUNT(*) FROM returns GROUP BY reason
- id: q07
  question: What is the total refund amount across all returns?
