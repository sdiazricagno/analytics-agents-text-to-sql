- id: q67
  question: Which stores had 2024 revenue above the average store revenue for 2024?
  sql: |
    WITH s AS (
      SELECT st.store_name, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS revenue
      FROM order_items oi JOIN orders o ON oi.order_id = o.order_id JOIN stores st ON o.store_id = st.store_id
