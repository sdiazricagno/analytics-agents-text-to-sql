- id: q76
  question: Which product had the most units sold in each department?
  sql: |
    WITH u AS (
      SELECT c.department, p.product_name, SUM(oi.quantity) AS units,
        ROW_NUMBER() OVER (PARTITION BY c.department ORDER BY SUM(oi.quantity) DESC) AS rn
      FROM order_items oi JOIN orders o ON oi.order_id = o.order_id
      JOIN products p ON oi.product_id = p.product_id JOIN categories c ON p.category_id = c.category_id
      WHERE o.status <> 'Cancelled' GROUP BY c.department, p.product_name
    )
    SELECT department, product_name FROM u WHERE rn = 1
