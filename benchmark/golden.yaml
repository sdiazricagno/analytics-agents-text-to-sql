- id: q62
  question: Show revenue for each month of 2025 and the change versus the previous month
  sql: |
    WITH m AS (
      SELECT DATE_TRUNC('month', o.order_date) AS month, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS revenue
      FROM order_items oi JOIN orders o ON oi.order_id = o.order_id
      WHERE o.status <> 'Cancelled' AND EXTRACT(year FROM o.order_date) = 2025 GROUP BY 1
    )
    SELECT month, revenue, revenue - LAG(revenue) OVER (ORDER BY month) FROM m
