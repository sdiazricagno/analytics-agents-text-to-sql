- id: q66
  question: What is the gross margin divided by revenue for each department?
  sql: |
    SELECT c.department,
      SUM(oi.quantity * (oi.unit_price * (1 - oi.discount) - p.unit_cost))
        / SUM(oi.quantity * oi.unit_price * (1 - oi.discount))
