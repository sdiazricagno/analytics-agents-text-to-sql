- id: q75
  question: For each customer segment, what is the average total revenue per customer?
  sql: |
    WITH c AS (
      SELECT cu.segment, o.customer_id, SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS revenue
      FROM order_items oi JOIN orders o ON oi.order_id = o.order_id
