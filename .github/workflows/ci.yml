name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Deterministic semantic-layer benchmark
        run: |
          python -m t2s.warehouse
          python -m t2s.benchmark --mode semantic_only --out /tmp/results
